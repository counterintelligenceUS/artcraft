name: "Artcraft Linux Publish"

on:
  push:
    branches:
      - release
      - artcraft-release
      - artcraft-linux

# Linux packages for Ubuntu 24.04 / Linux Mint 22.
# Same release branches as the Windows workflow. Draft release, same tag name,
# so a Windows run and a Linux run upload onto one ArtCraft release.
# Do not set RUSTFLAGS=-C target-feature=+crt-static; that flag is Windows-only.

jobs:
  publish-artcraft-linux:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file patchelf \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libfuse2t64 squashfs-tools \
            pkg-config cmake clang libclang-dev llvm nasm \
            g++-14 libstdc++-14-dev

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        run: |
          cd ./frontend
          npm cache clean --force
          echo "Installing all workspace dependencies..."
          npm ci
          echo "=== Version Information ==="
          node --version
          npm --version
          echo "=== Nx versions from lockfile ==="
          npm list --depth=0 | grep nx

      - name: Pre-build frontend to avoid Tauri build issues
        run: |
          cd ./frontend
          export NODE_OPTIONS="--max-old-space-size=8192"
          npx nx run artcraft:build
          cd "${GITHUB_WORKSPACE}/crates/desktop/artcraft"
          node -e "const fs = require('fs'); const config = JSON.parse(fs.readFileSync('tauri.conf.json', 'utf8')); config.build.beforeBuildCommand = ''; fs.writeFileSync('tauri.conf.json', JSON.stringify(config, null, 2));"

      - name: build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SQLX_OFFLINE: true
        with:
          projectPath: ./crates/desktop/artcraft
          tagName: artcraft-v__VERSION__
          releaseName: "ArtCraft v__VERSION__"
          releaseBody: "Production build of ArtCraft. See the assets below to download and install."
          releaseDraft: true
          prerelease: false
          args: --bundles deb,appimage
